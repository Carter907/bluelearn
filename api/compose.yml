services:
  typesense:
    image: typesense/typesense:30.2
    env_file:
      - .dev.vars
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data # was ./data/typesense_data:/data
    restart: unless-stopped

volumes:
  typesense_data:
