type: object
additionalProperties: false
description: >
  A variant starts as a draft, so every field is optional here and completeness
  is checked when the draft is submitted. Its slug is derived at publish, so it
  is never sent. Prereqs and todos are absent on purpose: those hang off the
  guide_base the variant shares with its siblings, so a variant cannot set them.
properties:
  title:
    type: [string, "null"]
    maxLength: 200
    example: Physics-based approach
  summary:
    type: [string, "null"]
    maxLength: 500
  body:
    type: [string, "null"]
  tags:
    type: array
    description: Ids of existing subjects to tag the variant with.
    items:
      type: string
      format: uuid
  newSubjects:
    type: array
    description: Subjects the author is proposing inline. Created as drafts.
    items:
      $ref: "../guides/NewSubject.yaml"
