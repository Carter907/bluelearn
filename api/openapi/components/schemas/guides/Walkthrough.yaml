type: object
additionalProperties: false
description: A guide's transitive prerequisite DAG, RLS-filtered.
properties:
  nodes:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "../common/Uuid.yaml"
        slug:
          type: string
          example: arithmetic
        title:
          type: string
          example: Arithmetic
        summary:
          type: [string, "null"]
        level:
          type: integer
          description: >
            Longest prerequisite-chain hops ahead of this walkthrough's base
            prerequisites (level = 1), so the target holds the highest level.
          example: 2
        duration_minutes:
          description: Estimated reading time, derived from the body's word count.
          type: integer
          example: 4
        tags:
          description: Subjects the guide is tagged with. slug links to the subject page.
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              slug:
                type: string
                example: math
              name:
                type: string
                example: Mathematics
            required: [slug, name]
      required: [id, slug, title, level, duration_minutes, tags]
  edges:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        from_id:
          $ref: "../common/Uuid.yaml"
        to_id:
          $ref: "../common/Uuid.yaml"
      required: [from_id, to_id]
required: [nodes, edges]
