type: object
additionalProperties: false
description: >
  A revision's curriculum graph: every node (included or skipped) and both edge
  layers behind the show-skipped toggle. Shared by the public objective page
  (/objectives/{slug}) and the revision editor (/objective-revisions/{id}); each wraps it
  alongside its own identity object.
properties:
  nodes:
    type: array
    items:
      $ref: "../objective-revisions/ObjectiveNode.yaml"
  orders:
    description: >
      The curator's linear order: one row per placed node per target, so a topic
      shared across targets can sit at a different position under each. This is
      the objective's primary view; the edge sets below back the graph view.
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        target_node_id:
          $ref: "../common/Uuid.yaml"
        node_id:
          $ref: "../common/Uuid.yaml"
        position:
          type: integer
          minimum: 0
      required: [target_node_id, node_id, position]
  projected_edges:
    description: >
      Hide-skipped view: the prerequisite edges among included nodes only,
      bridged across skipped ones, frozen at publish.
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        from_id:
          $ref: "../common/Uuid.yaml"
        to_id:
          $ref: "../common/Uuid.yaml"
      required: [from_id, to_id]
  raw_edges:
    description: >
      Show-skipped view: the prerequisite edges among all of this revision's
      nodes, read live from the guide graph with no bridging over skipped nodes.
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        from_id:
          $ref: "../common/Uuid.yaml"
        to_id:
          $ref: "../common/Uuid.yaml"
      required: [from_id, to_id]
required: [nodes, orders, projected_edges, raw_edges]
