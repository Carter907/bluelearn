type: object
additionalProperties: false
description: >
  One goal in an objective's curation, with the topics placed under it. Exactly
  one target across the set is featured; if none is, the first one becomes it.
properties:
  guide_base_id:
    description: The guide base this goal reaches.
    $ref: "../common/Uuid.yaml"
  is_featured:
    description: Whether this goal's sequence is the one the objective's card surfaces.
    type: boolean
    default: false
  sequence:
    description: >
      Guide base ids in the order the curator placed them under this goal.
      Leaving it off every target edits the goal set without touching the
      curation beneath it; sending it makes the listed topics the included ones
      and the rest of the closure skipped.
    type: array
    items:
      $ref: "../common/Uuid.yaml"
required: [guide_base_id]
