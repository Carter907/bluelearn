type: object
additionalProperties: false
description: >
  Overwrite a draft revision's metadata or curation (draft only;
  published is immutable). Partial.
minProperties: 1
properties:
  title:
    type: string
    example: Backend Engineer
  summary:
    type: [string, "null"]
    example: Updated summary
  change_summary:
    description: The curator's note describing what changed in this revision.
    type: [string, "null"]
    example: Added a statistics branch before ML.
  targets:
    description: >
      The objective's goals in the order they should read. Replaces the whole
      target set: position comes from the array index, and the closure is
      recomputed, so topics no longer reached by any goal leave the revision.
    type: array
    minItems: 1
    items:
      $ref: "./ObjectiveTarget.yaml"
