type: object
additionalProperties: false
description: One topic in an objective revision (included or skipped).
properties:
  id:
    description: The node's own id, which the revision's order rows point at.
    $ref: "../common/Uuid.yaml"
  guide_base_id:
    $ref: "../common/Uuid.yaml"
  guide_id:
    description: The pinned guide variant (always set); content is read live through it.
    $ref: "../common/Uuid.yaml"
  slug:
    description: The pinned guide's slug, read live; null before the guide's first publish.
    type: [string, "null"]
    example: postgres
  title:
    description: The pinned guide's title, read live through its current revision.
    type: string
    example: PostgreSQL
  is_target:
    type: boolean
    example: true
  is_included:
    description: >
      False means the curator skipped this topic: it stays on the revision as a
      re-includable candidate but is excluded from the published curriculum and
      bridged over by edge projection.
    type: boolean
    example: true
  is_featured:
    description: >
      Whether this target's sequence is the one the objective's card surfaces.
      A published revision has exactly one featured node.
    type: boolean
    example: false
  target_position:
    description: Where this goal sits among the objective's goals; null unless a target.
    type: [integer, "null"]
    example: 0
  note:
    type: [string, "null"]
    example: Optional curator note
required:
  [
    id,
    guide_base_id,
    guide_id,
    is_target,
    is_included,
    is_featured,
    target_position,
  ]
