type: object
additionalProperties: false
description: A guide the submission declares as a prerequisite.
properties:
  slug:
    type: string
    example: calculus
  title:
    type: [string, "null"]
    description: >
      Read off the prerequisite's canonical guide's live revision. Null while
      that base has nothing published yet.
    example: Calculus
required: [slug, title]
