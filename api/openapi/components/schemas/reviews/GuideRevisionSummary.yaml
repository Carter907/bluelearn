type: object
additionalProperties: false
description: The guide revision the case is judging.
properties:
  id:
    $ref: "../common/Uuid.yaml"
  title:
    type: [string, "null"]
    example: Calculus
  summary:
    type: [string, "null"]
    example: A short overview of the guide.
  body:
    type: [string, "null"]
    example: "# Calculus\n\nThe body of the guide in markdown."
  status:
    type: string
    example: submitted
  created_at:
    $ref: "../common/Timestamp.yaml"
  duration_minutes:
    type: integer
    example: 7
  tags:
    type: array
    description: >
      Subjects the revision is tagged with, identified by id because a subject
      proposed alongside the revision has no slug until it is published. Draft
      subjects are only present for a viewer who can see the submission.
    items:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "../common/Uuid.yaml"
        name:
          type: string
          example: Topology
        status:
          type: string
          enum: [draft, published]
          example: draft
      required: [id, name, status]
required: [id, status, created_at, duration_minutes, tags]
