type: object
additionalProperties: false
properties:
  id:
    $ref: "../common/Uuid.yaml"
  slug:
    description: Null until a review approves the subject and assigns its handle.
    type: [string, "null"]
    example: math
  name:
    type: string
    example: Mathematics
  summary:
    type: [string, "null"]
  status:
    description: Draft until a review approves the subject alongside its guide.
    type: string
    enum: [draft, published]
required: [id, slug, name, summary, status]
